[project]
name = "pev2"
version = "0.1.0"
description = "Procurement Engine V2: the workflow-first procurement solution generated by the Agent Architecture Studio, running on mocks"
authors = [{ name = "Jan Lange", email = "JNGE@danishcrown.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "gradio>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
pev2 = "pev2.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pev2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a model endpoint; run with `pytest -m live`"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
